name: Verificar ajustes de cobro

on:
  push:
    branches:
      - fix/checkout-amount-fields
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compilar e importar ventanas
        shell: pwsh
        run: |
          python -m compileall -q app
          $env:QT_QPA_PLATFORM="offscreen"
          python -c "from app.ui.sale_window import SalePaymentDialog, PaymentAmountInput; print('Cobro listo')"
      - name: Ejecutar pruebas
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM="offscreen"
          python -m pytest -q
