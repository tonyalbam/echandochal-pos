name: Construir instalador de Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión del candidato
        required: true
        default: 1.2.0
  push:
    branches:
      - release/1.2.0

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ejecutar pruebas
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install pytest
          python -m compileall -q app
          python -m pytest -q

      - name: Preparar creador del instalador
        shell: pwsh
        run: |
          $InnoSetup = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $InnoSetup)) {
            choco install innosetup --no-progress -y
          }

      - name: Construir aplicación e instalador
        shell: pwsh
        run: |
          $Version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($Version)) {
            $Version = "1.2.0"
          }
          .\build_windows.ps1 -Version $Version -RequireInstaller

      - name: Preparar instrucciones y huella digital
        shell: pwsh
        run: |
          Copy-Item RELEASE_1.2.0.md release\INSTRUCCIONES_ACTUALIZACION.md
          $Setup = Get-Item release\EchandoChalPOS-Setup-1.2.0.exe
          $Hash = (Get-FileHash -Algorithm SHA256 $Setup.FullName).Hash.ToLowerInvariant()
          "$Hash  $($Setup.Name)" | Set-Content release\SHA256SUMS.txt -Encoding ascii

      - name: Publicar paquete de actualización v1.2.0
        uses: actions/upload-artifact@v4
        with:
          name: EchandoChalPOS-v1.2.0-Windows
          path: |
            release\EchandoChalPOS-Setup-*.exe
            release\EchandoChalPOS-Portable-*.zip
            release\INSTRUCCIONES_ACTUALIZACION.md
            release\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
